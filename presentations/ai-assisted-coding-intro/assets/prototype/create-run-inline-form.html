<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prototype — Create a workflow from the page (COFFE-14)</title>
    <link rel="stylesheet" href="app.css" />
    <style>
      /* Genuinely new vocabulary: the real app has no form controls yet, so
         nothing in app.css styles an input. Keep it in the token language. */
      .field {
        width: 100%;
        padding: 0.375rem 0.625rem;
        border-radius: var(--radius-2);
        border: 1px solid var(--color-rule);
        background: var(--color-bg);
        color: var(--color-fg);
        font: inherit;
      }
      .field::placeholder { color: var(--color-muted); }
      /* app.css is generated by scanning app/ only, so classes the real app has
         never used are absent from it. These stand in for the ones a real
         implementation would introduce. */
      .field-label { display: block; margin-bottom: 0.25rem; }
      .stack { display: block; margin-bottom: 0.75rem; }
      .btn-primary {
        border-color: var(--color-accent) !important;
        color: var(--color-accent) !important;
      }
      .btn-primary:hover:not(:disabled) { background: var(--color-bg-soft); }
      .field:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 1px;
      }
      /* The prototype's own scaffolding — a state switcher the product has not got. */
      .proto-bar {
        position: sticky; top: 0; z-index: 10;
        display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
        padding: .5rem 1rem;
        background: var(--color-bg-soft);
        border-bottom: 1px solid var(--color-rule);
        font-size: .875rem;
      }
      .proto-bar strong { color: var(--color-strong); }
      .proto-bar button {
        padding: .25rem .625rem; border-radius: var(--radius-2);
        border: 1px solid var(--color-rule); background: var(--color-bg);
        color: var(--color-fg); font: inherit; cursor: pointer;
      }
      .proto-bar button[aria-pressed="true"] {
        border-color: var(--color-accent); color: var(--color-accent);
      }
      button:disabled { cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div class="proto-bar">
      <strong>Prototype scaffolding</strong>
      <span class="text-fg-2">list state:</span>
      <button data-scenario="empty" aria-pressed="false">no runs</button>
      <button data-scenario="one" aria-pressed="true">one run</button>
      <button data-scenario="many" aria-pressed="false">many runs (incl. failed + completed)</button>
      <span class="text-fg-2">| next create:</span>
      <button data-outcome="ok" aria-pressed="true">succeeds</button>
      <button data-outcome="400" aria-pressed="false">server 400</button>
    </div>

    <main class="max-w-3xl mx-auto p-8">
      <header class="mb-6">
        <h1 class="text-2xl font-semibold text-strong">Runs</h1>
        <p class="text-fg-2">Every workflow run and the step it is waiting on.</p>
      </header>

      <div class="banner" id="banner" hidden></div>

      <!-- AC-1: create form, always visible, directly under the header, above the list -->
      <section class="p-4 rounded-3 border border-rule bg-bg-2 mt-6" id="create-form">
        <div class="font-semibold text-strong mb-3">New run</div>

        <label class="stack">
          <span class="field-label text-sm text-fg-2">Run name</span>
          <input class="field" id="run-name" placeholder="Onboard a new hire" />
        </label>

        <span class="field-label text-sm text-fg-2">Steps</span>
        <ul class="space-y-2" id="step-rows"></ul>

        <div class="mt-3 flex gap-2">
          <button class="px-3 py-1 rounded-2 border border-rule text-fg hover:bg-bg-2 disabled:opacity-50" id="add-step">Add step</button>
          <button class="px-3 py-1 rounded-2 border border-rule text-fg btn-primary disabled:opacity-50" id="create-run" disabled>Create run</button>
        </div>
      </section>

      <div class="p-6 border border-dashed border-rule rounded-2 text-fg-2 bg-bg-soft mt-6" id="empty-state" hidden>
        No runs yet.
      </div>

      <div class="mt-6 space-y-4" id="runs"></div>
    </main>

    <script>
      // ---------- mock data ----------
      const SCENARIOS = {
        empty: [],
        one: [
          { id: "r1", name: "Onboard a new hire", completed: false, steps: [
            { title: "Send offer letter", status: "done" },
            { title: "Create accounts", status: "pending" },
            { title: "Ship laptop", status: "pending" },
          ]},
        ],
        many: [
          { id: "r1", name: "Onboard a new hire", completed: false, steps: [
            { title: "Send offer letter", status: "done" },
            { title: "Create accounts", status: "pending" },
            { title: "Ship laptop", status: "pending" },
          ]},
          { id: "r2", name: "Release 2.4", completed: false, steps: [
            { title: "Cut branch", status: "done" },
            { title: "Run smoke tests", status: "failed" },
            { title: "Publish", status: "pending" },
          ]},
          { id: "r3", name: "Quarterly audit", completed: true, steps: [
            { title: "Pull ledger", status: "done" },
            { title: "Reconcile", status: "skipped" },
          ]},
          // A run created with no name via curl — the "missing value" case.
          { id: "r4", name: "", completed: false, steps: [
            { title: "Untitled work", status: "pending" },
          ]},
        ],
      };

      const CHIP = {
        pending: "border-rule text-fg-2 bg-bg-2",
        done: "border-success text-success bg-bg-soft",
        skipped: "border-muted text-muted bg-bg-soft",
        failed: "border-warn text-warn bg-bg-soft",
      };
      const LABEL = { pending: "pending", done: "done", skipped: "skipped", failed: "failed" };

      let runs = SCENARIOS.one.map((r) => ({ ...r }));
      let steps = [""];          // one empty row at start (AC-1, AC-3)
      let busy = false;
      let outcome = "ok";
      let nextId = 90;

      // ---------- render ----------
      const $ = (id) => document.getElementById(id);

      function render() {
        renderForm();
        renderList();
      }

      function renderForm() {
        const rows = $("step-rows");
        rows.innerHTML = "";
        steps.forEach((value, i) => {
          const li = document.createElement("li");
          li.className = "flex items-center gap-3";
          li.innerHTML =
            '<input class="field" placeholder="Step title" />' +
            '<button class="px-3 py-1 rounded-2 border border-rule text-fg hover:bg-bg-2 disabled:opacity-50">Remove</button>';
          const input = li.querySelector("input");
          input.value = value;
          input.disabled = busy;
          input.addEventListener("input", (e) => { steps[i] = e.target.value; syncCreateEnabled(); });
          const remove = li.querySelector("button");
          // AC-3: no remove control offered for the last remaining row.
          remove.disabled = steps.length === 1 || busy;
          remove.addEventListener("click", () => { steps.splice(i, 1); render(); });
          rows.appendChild(li);
        });
        $("run-name").disabled = busy;
        $("add-step").disabled = busy;
        syncCreateEnabled();
      }

      function nonBlank() {
        return steps.map((s) => s.trim()).filter((s) => s.length > 0);
      }

      // AC-2: disabled until a name and at least one non-blank step exist.
      function syncCreateEnabled() {
        const ok = $("run-name").value.trim().length > 0 && nonBlank().length > 0;
        $("create-run").disabled = !ok || busy;
      }

      function renderList() {
        $("empty-state").hidden = runs.length > 0 || busy;
        const host = $("runs");
        host.innerHTML = "";
        runs.forEach((run) => host.appendChild(runView(run)));
      }

      function runView(run) {
        const section = document.createElement("section");
        section.className = "p-4 rounded-3 border border-rule bg-bg-2";

        const head = document.createElement("div");
        head.className = "flex items-baseline justify-between mb-3";
        const name = document.createElement("span");
        name.className = run.name ? "font-semibold text-strong" : "font-semibold text-muted";
        name.textContent = run.name || "(untitled run)";
        const prog = document.createElement("span");
        prog.className = "text-sm text-muted";
        prog.textContent = run.completed
          ? "completed"
          : run.steps.filter((s) => s.status !== "pending").length + " of " + run.steps.length;
        head.append(name, prog);

        const ul = document.createElement("ul");
        ul.className = "space-y-2";
        run.steps.forEach((step) => {
          const li = document.createElement("li");
          li.className = "flex items-center gap-3";
          const chip = document.createElement("span");
          chip.className = "px-2 py-0.5 rounded-2 text-sm border " + CHIP[step.status];
          chip.textContent = LABEL[step.status];
          const title = document.createElement("span");
          title.className = "flex-1";
          title.textContent = step.title;
          const actions = document.createElement("div");
          actions.className = "flex gap-2";
          if (step.status === "pending") {
            actions.append(btn("Skip"), btn("Fail"));
          } else if (step.status === "failed") {
            actions.append(btn("Retry"));
          }
          li.append(chip, title, actions);
          ul.appendChild(li);
        });

        const foot = document.createElement("div");
        foot.className = "mt-3";
        const advance = btn("Advance");
        advance.disabled = busy || run.completed;
        foot.appendChild(advance);

        section.append(head, ul, foot);
        return section;
      }

      function btn(label) {
        const b = document.createElement("button");
        b.className = "px-3 py-1 rounded-2 border border-rule text-fg hover:bg-bg-2 disabled:opacity-50";
        b.textContent = label;
        b.disabled = busy;
        return b;
      }

      function banner(message, variant) {
        const el = $("banner");
        if (!message) { el.hidden = true; el.textContent = ""; el.className = "banner"; return; }
        el.hidden = false;
        el.className = "banner " + variant;
        el.textContent = message;
      }

      // ---------- interactions ----------
      $("run-name").addEventListener("input", syncCreateEnabled);
      $("add-step").addEventListener("click", () => { steps.push(""); render(); });

      $("create-run").addEventListener("click", () => {
        const name = $("run-name").value.trim();
        const titles = nonBlank();             // blank rows silently dropped
        busy = true; banner(null); render();

        // Stand in for POST /api/v1/runs then a refetch of GET /api/v1/runs.
        setTimeout(() => {
          busy = false;
          if (outcome === "400") {
            // AC-6: banner, no new run, form still usable and still filled in.
            banner("The server refused that (400).", "warn");
            render();
            return;
          }
          runs = runs.concat([{
            id: "r" + nextId++,
            name,
            completed: false,
            steps: titles.map((t) => ({ title: t, status: "pending" })),
          }]);
          // AC-5: form back to its initial state, no banner.
          $("run-name").value = "";
          steps = [""];
          render();
        }, 350);
      });

      document.querySelectorAll("[data-scenario]").forEach((b) => {
        b.addEventListener("click", () => {
          document.querySelectorAll("[data-scenario]").forEach((o) => o.setAttribute("aria-pressed", "false"));
          b.setAttribute("aria-pressed", "true");
          runs = SCENARIOS[b.dataset.scenario].map((r) => ({ ...r }));
          banner(null);
          render();
        });
      });

      document.querySelectorAll("[data-outcome]").forEach((b) => {
        b.addEventListener("click", () => {
          document.querySelectorAll("[data-outcome]").forEach((o) => o.setAttribute("aria-pressed", "false"));
          b.setAttribute("aria-pressed", "true");
          outcome = b.dataset.outcome;
        });
      });

      render();
    </script>
  </body>
</html>
